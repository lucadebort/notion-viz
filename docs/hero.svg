  <title id="title">NotionViz</title>
  <desc id="desc">A Notion workspace drawn as a graph on a dark canvas: five databases with their properties, linked by their relations. Projects is selected; the pointer rests on its Tasks relation, which lights the relation and the Tasks database. A side panel lists the properties, connections and latest entries of Projects.</desc>
